# 生成全部卡片：看板 / 热力图 / 活动曲线（深浅各一套）+ 数据快照
name: 生成 GitHub 数据卡片

on:
  schedule:
    - cron: '23 1 * * *'        # 每天 09:23（北京时间）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_LOGIN: 777nx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 1/4 贡献热力图
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/contrib-heatmap.mjs

      - name: 2/4 数据看板 + 活动曲线 + 简单统计卡
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/dashboard.mjs
          node scripts/activity-chart.mjs
          node scripts/github-stats.mjs

      - name: 3/4 更新 README 里的「最后更新于」日期
        run: |
          DATE=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          sed -i -E "s/最后更新于 [0-9]{4}-[0-9]{2}-[0-9]{2}/最后更新于 ${DATE}/" README.md
          git add README.md

      - name: 4/4 提交回 main
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contrib-heatmap.svg assets/contrib-heatmap-light.svg \
                  assets/dashboard.svg assets/dashboard-light.svg \
                  assets/activity.svg assets/activity-light.svg \
                  assets/github-stats.svg assets/github-stats-light.svg \
                  assets/contrib-data.json
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "chore: 更新 GitHub 数据卡片 [skip ci]"
            git push
          fi
